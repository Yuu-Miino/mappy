name: Deploy documents

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install documentation dependencies
        run: uv sync --group docs

      - name: Build HTML
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: html
          path: docs/build/html
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v5
        with:
          repository: Yuu-Miino/doc.mappy
          ref: gh-pages
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Remove current directory
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if test -d "$REF_NAME"; then
            rm -r "$REF_NAME"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: html
          path: ${{ github.ref_name }}

      - name: Update latest link
        shell: bash
        run: |
          latest=$(ls -d v*/ 2>/dev/null | sed 's#/$##' | sort -V | tail -n 1)
          if test -n "$latest"; then
            ln -sfn "$latest" latest
          fi

      - name: Push to the documentation repository
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A .
          git diff --cached --quiet || git commit -m "Update docs for ${{ github.ref_name }} (${{ github.sha }})"
          git push origin gh-pages
