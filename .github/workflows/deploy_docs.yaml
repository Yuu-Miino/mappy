name: Deploy documents

on:
  push:
    tags:
      - 'v*'
    branches:
      - develop
  workflow_dispatch:
    inputs:
      ref:
        description: Tag (vX.Y.Z) or branch whose docs to build and publish
        required: true
        type: string

env:
  # Directory of the published site: the pushed tag/branch, or the manual input.
  DOC_REF: ${{ inputs.ref || github.ref_name }}

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: '3.13'

      - name: Install documentation dependencies
        run: uv sync --group docs

      - name: Build HTML
        run: uv run sphinx-build -W --keep-going -b html docs/source docs/build/html

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: html
          path: docs/build/html
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation repository
        uses: actions/checkout@v7
        with:
          repository: Yuu-Miino/doc.mappy
          ref: gh-pages
          # Deploy key of doc.mappy (write access); see docs/PUBLISHING.md
          ssh-key: ${{ secrets.DOC_DEPLOY_KEY }}

      - name: Remove current directory
        env:
          REF_NAME: ${{ env.DOC_REF }}
        run: |
          if test -d "$REF_NAME"; then
            rm -r "$REF_NAME"
          fi

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: html
          path: ${{ env.DOC_REF }}

      - name: Update latest link
        shell: bash
        run: |
          latest=$(ls -d v*/ 2>/dev/null | sed 's#/$##' | sort -V | tail -n 1)
          if test -n "$latest"; then
            ln -sfn "$latest" latest
          fi

      - name: Push to the documentation repository
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A .
          git diff --cached --quiet || git commit -m "Update docs for ${{ env.DOC_REF }}"
          git push origin gh-pages
